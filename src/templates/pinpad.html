{% extends "base.html" %}
{% block title %}Pinpad — Avaliação{% endblock %}
{% block content %}
<div class="card">
  <p class="eyebrow">Atendimento presencial em caixa</p>
  <h1>Como foi o atendimento?</h1>

  <label for="categoria">Categoria do atendimento</label>
  <select id="categoria" required>
    <option value="" disabled selected>Selecione</option>
    {% for c in categorias %}
    <option value="{{ c.nome }}">{{ c.nome }}</option>
    {% endfor %}
  </select>

  <label>Nota</label>
  <div class="nota-picker" id="nota-picker">
    {% for n in range(1, 6) %}
    <button type="button" data-valor="{{ n }}">{{ n }}</button>
    {% endfor %}
  </div>

  <button type="button" class="btn-enviar" id="btn-enviar">Registrar avaliação</button>
  <div class="mensagem" id="mensagem"></div>
</div>

<script>
  const API_KEY = "{{ api_key }}";
  let notaSelecionada = null;

  document.querySelectorAll("#nota-picker button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#nota-picker button").forEach((b) => b.classList.remove("selecionada"));
      btn.classList.add("selecionada");
      notaSelecionada = parseInt(btn.dataset.valor, 10);
    });
  });

  document.getElementById("btn-enviar").addEventListener("click", async () => {
    const mensagem = document.getElementById("mensagem");
    const categoria = document.getElementById("categoria").value;
    mensagem.className = "mensagem";

    if (!categoria || !notaSelecionada) {
      mensagem.className = "mensagem erro";
      mensagem.textContent = "Selecione a categoria e a nota.";
      return;
    }

    try {
      const resposta = await fetch("/avaliacoes/pinpad", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify({ categoria, nota: notaSelecionada }),
      });

      if (resposta.ok) {
        mensagem.className = "mensagem sucesso";
        mensagem.textContent = "Avaliação registrada. Próximo cliente, por favor.";
        document.querySelectorAll("#nota-picker button").forEach((b) => b.classList.remove("selecionada"));
        document.getElementById("categoria").selectedIndex = 0;
        notaSelecionada = null;
      } else {
        const erro = await resposta.json();
        mensagem.className = "mensagem erro";
        mensagem.textContent = erro.detail || "Não foi possível registrar.";
      }
    } catch (e) {
      mensagem.className = "mensagem erro";
      mensagem.textContent = "Erro de conexão.";
    }
  });
</script>
{% endblock %}
