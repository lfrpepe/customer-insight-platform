{% extends "base.html" %}
{% block title %}Pinpad — Avaliação{% endblock %}
{% block content %}
<div class="card">
  <p class="eyebrow">Atendimento presencial em caixa</p>
  <h1>Como foi o atendimento?</h1>

  <label for="categoria">Categoria do atendimento</label>
  <select id="categoria" required>
    <option value="" disabled selected>Selecione</option>
    {% for c in categorias %}
    <option value="{{ c.nome }}">{{ c.nome }}</option>
    {% endfor %}
  </select>

  <label>Nota</label>
  <div class="estrela-picker" id="nota-picker">
    {% for n in range(1, 6) %}
    <button type="button" data-valor="{{ n }}" aria-label="{{ n }} estrela(s)">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63L17.9 21 12 17.77 6.1 21l1.15-7.1L2.5 9.27l6.6-1.01L12 2z"/></svg>
    </button>
    {% endfor %}
  </div>

  <button type="button" class="btn-enviar" id="btn-enviar">Registrar avaliação</button>
</div>

<script>
  const API_KEY = "{{ api_key }}";
  const estrelas = configurarEstrelas("nota-picker");

  document.getElementById("btn-enviar").addEventListener("click", async () => {
    const categoria = document.getElementById("categoria").value;

    if (!categoria || !estrelas.valor) {
      mostrarToast("Selecione a categoria e a nota.", "erro");
      return;
    }

    try {
      const resposta = await fetch("/avaliacoes/pinpad", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify({ categoria, nota: estrelas.valor }),
      });

      if (resposta.ok) {
        mostrarToast("Avaliação registrada. Próximo cliente, por favor.", "sucesso");
        document.getElementById("categoria").selectedIndex = 0;
        estrelas.reset();
      } else {
        const erro = await resposta.json();
        mostrarToast(erro.detail || "Não foi possível registrar.", "erro");
      }
    } catch (e) {
      mostrarToast("Erro de conexão.", "erro");
    }
  });
</script>
{% endblock %}
