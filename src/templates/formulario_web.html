{% extends "base.html" %}
{% block title %}Formulário Web — Avaliação{% endblock %}
{% block topbar_extra %}<a class="topbar-voltar" href="/">← Todas as telas</a>{% endblock %}
{% block content %}
<div class="card">
  <p class="eyebrow">Customer Insight Platform</p>
  <h1>Avalie o atendimento que você recebeu</h1>

  <form id="form-avaliacao">
    <label for="nome_cliente">Nome completo</label>
    <input type="text" id="nome_cliente" required maxlength="150" placeholder="Nome e sobrenome">

    <label for="cpf">CPF</label>
    <input type="text" id="cpf" required placeholder="000.000.000-00">

    <label for="email">E-mail (opcional)</label>
    <input type="email" id="email">

    <label for="telefone">Telefone (opcional)</label>
    <input type="text" id="telefone" placeholder="(11) 98765-4321">

    <label for="categoria">Categoria do atendimento</label>
    <select id="categoria" required>
      <option value="" disabled selected>Selecione</option>
      {% for c in categorias %}
      <option value="{{ c.nome }}">{{ c.nome }}</option>
      {% endfor %}
    </select>

    <label>Nota</label>
    <div class="estrela-picker" id="nota-picker">
      {% for n in range(1, 6) %}
      <button type="button" data-valor="{{ n }}" aria-label="{{ n }} estrela(s)">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63L17.9 21 12 17.77 6.1 21l1.15-7.1L2.5 9.27l6.6-1.01L12 2z"/></svg>
      </button>
      {% endfor %}
    </div>

    <label for="comentario">Comentário (opcional)</label>
    <textarea id="comentario" maxlength="1000"></textarea>

    <button type="submit" class="btn-enviar">Enviar avaliação</button>
  </form>
</div>

<script>
  // Chave injetada pelo servidor (Jinja2, a partir do .env) — válida
  // porque esta tela roda no ambiente interno da empresa, não na
  // internet pública (ver ADR-007). Se este formulário virar público,
  // esse padrão precisa mudar para outro modelo de proteção.
  const API_KEY = "{{ api_key }}";
  const estrelas = configurarEstrelas("nota-picker");
  aplicarMascaraTelefone("telefone");aplicarMascaraCPF("cpf");

  document.getElementById("form-avaliacao").addEventListener("submit", async (evento) => {
    evento.preventDefault();

    if (!estrelas.valor) {
      mostrarToast("Selecione uma nota de 1 a 5.", "erro");
      return;
    }

    const payload = {
      nome_cliente: document.getElementById("nome_cliente").value,
      cpf: document.getElementById("cpf").value,
      email: document.getElementById("email").value || null,
      telefone: document.getElementById("telefone").value || null,
      categoria: document.getElementById("categoria").value,
      nota: estrelas.valor,
      comentario: document.getElementById("comentario").value || null,
    };

    try {
      const resposta = await fetch("/avaliacoes/formulario-web", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
        body: JSON.stringify(payload),
      });

      if (resposta.ok) {
        mostrarToast("Avaliação registrada. Obrigado pelo retorno!", "sucesso");
        document.getElementById("form-avaliacao").reset();
        estrelas.reset();
      } else {
        const erro = await resposta.json();
        mostrarToast(extrairMensagemErro(erro.detail) || "Não foi possível registrar.", "erro");
      }
    } catch (e) {
      mostrarToast("Erro de conexão. Tente novamente.", "erro");
    }
  });
</script>
{% endblock %}
